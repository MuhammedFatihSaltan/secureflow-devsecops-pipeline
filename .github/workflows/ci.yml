name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Repo kodunu al (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.12 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kod Formatı ve Standart Kontrolü (Black & Flake8)
      run: |
        black --check app/ tests/
        flake8 app/ tests/

    - name: Birim Testleri (pytest)
      run: |
        pytest --cov=app tests/

    - name: Docker İmajını Derle (Build Test)
      run: |
        docker build -t secureflow-api:test .
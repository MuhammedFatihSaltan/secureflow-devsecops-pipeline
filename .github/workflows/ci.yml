name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Repo kodunu al (Checkout)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # SonarQube'un tüm geçmişi analiz edebilmesi için gerekli

    - name: Python 3.12 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kod Formatı ve Standart Kontrolü (Black & Flake8)
      run: |
        black --check app/ tests/
        flake8 app/ tests/

    - name: Birim Testleri (pytest)
      run: |
        python -m pytest --cov=app --cov-report=xml tests/

    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Docker İmajını Derle (Build Test)
      run: |
        docker build -t secureflow-api:test .